      <div class="space-y-6">

    <div class="flex-1 bg-white shadow-lg rounded-lg p-8">

        <input type="hidden" name="access_key" value="e3f16e61-52c7-47fb-817c-86fbffd65ba2" />
        <div class="form-control">
          <label class="label">
            <span class="label-text text-lg">Your Name</span>
          </label>
          <input type="text" name="name" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text text-lg">E-Mail Address</span>
          </label>
          <input type="email" name="email" class="input input-bordered" required />
        </div>
        <div class="form-control">
          <label class="label">
            <span class="label-text text-lg">Message</span>
          </label>
          <textarea name="message" class="textarea textarea-bordered" rows="6" required></textarea>
        </div>

        <button type="submit" class="btn btn-primary bg-blue-600 text-white w-full hover:bg-blue-800 text-lg font-medium transition">Send Message</button>
      </form>
    </div>
