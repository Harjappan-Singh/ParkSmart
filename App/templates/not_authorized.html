{% extends "layout.html" %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-gray-50 to-gray-100 text-gray-800 flex items-center justify-center">
    <div class="text-center p-8 bg-white rounded-lg shadow-lg max-w-md">
        <h1 class="text-4xl font-bold text-red-500 mb-4">403 - Forbidden</h1>
        <p class="text-lg mb-6">
            You are not authorized to view this page.
        </p>
        <p class="text-base mb-6">
            Please <a href="{{ url_for('index') }}" class="text-accent-color font-semibold underline">log in</a> to continue.
        </p>
        <a href="{{ url_for('index') }}" class="inline-block px-6 py-3 bg-blue-500 text-white text-lg font-medium rounded-lg shadow hover:bg-blue-600 transition">
            Go to Login
        </a>
    </div>
</div>
{% endblock %}
