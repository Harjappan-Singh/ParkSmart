{% extends "layout.html" %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-gray-900 to-gray-700 text-white">
    <div class="container mx-auto px-6 py-8">
        <h2 class="text-3xl font-bold mb-6 text-center">Parking Lot Information</h2>

        <div class="overflow-x-auto bg-gray-800 rounded-lg shadow-lg">
            <table class="table-auto w-full text-left text-gray-300">
                <thead class="bg-gray-700">
                    <tr>
                        <th class="px-4 py-2 border-b border-gray-600">Parking Spot</th>
                        <th class="px-4 py-2 border-b border-gray-600">Status</th>
                        <th class="px-4 py-2 border-b border-gray-600">Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in entries %}
                    <tr class="even:bg-gray-700 odd:bg-gray-800">
                        <td class="px-4 py-2 border-b border-gray-600">{{ entry.parking_spot }}</td>
                        <td class="px-4 py-2 border-b border-gray-600">
                            <span class="{{ 'text-green-400' if entry.status == 'available' else 'text-red-400' }}">
                                {{ entry.status }}
                            </span>
                        </td>
                        <td class="px-4 py-2 border-b border-gray-600">{{ entry.timestamp }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
