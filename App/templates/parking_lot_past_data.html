{% extends "layout.html" %}

{% block body %}
<div class="min-h-screen bg-gradient-to-br from-gray-100 to-gray-50 text-gray-800">
    <div class="container mx-auto px-6 py-8">
        <h1 class="text-3xl font-bold mb-6 text-center">Parking Lot Information</h1>

        <div class="overflow-x-auto bg-white rounded-lg shadow-lg">
            <table class="table-auto w-full text-left text-gray-700">
                <thead class="bg-gray-200">
                    <tr>
                        <th class="px-4 py-2 border-b border-gray-300">Parking Spot</th>
                        <th class="px-4 py-2 border-b border-gray-300">Status</th>
                        <th class="px-4 py-2 border-b border-gray-300">Timestamp</th>
                    </tr>
                </thead>
                <tbody>
                    {% for entry in entries %}
                    <tr class="even:bg-gray-100 odd:bg-white">
                        <td class="px-4 py-2 border-b border-gray-300">{{ entry.parking_spot }}</td>
                        <td class="px-4 py-2 border-b border-gray-300">
                            <span class="{{ 'text-green-600 font-semibold' if entry.status == 'available' else 'text-red-600 font-semibold' }}">
                                {{ entry.status }}
                            </span>
                        </td>
                        <td class="px-4 py-2 border-b border-gray-300">{{ entry.timestamp }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
